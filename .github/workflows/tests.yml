name: Testes e qualidade
on:
  push:
  pull_request:
jobs:
  validar:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
        pandas: ["2", "3"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          # Teste de compatibilidade sem alterar o limite de produção.
          pip install --no-deps --upgrade "pandas>=${{ matrix.pandas }},<${{ matrix.pandas == '2' && '3' || '4' }}"
      - name: Verificar lint
        run: ruff check sentinel tests
      - name: Executar testes
        run: pytest -q
